			}

			.landing-container h1 {

			}

			.landing-container h1 img {

				display: block;
				margin: 0 auto 1rem;
			}

			.landing-container p {
				font-size: 1.3rem;
				color: #999;
				margin-bottom: 2.5rem;
				line-height: 1.6;
			}

			.landing-container p:last-of-type {
				font-size: 1rem;
				color: #666;
				margin-bottom: 2.5rem;
			}

			.proxy-btn {
				padding: 1.2rem 3rem;
				background: linear-gradient(135deg, #ff8c00 0%, #ffa500 100%);
				border: none;
				border-radius: 0.6rem;
				color: #fff;
				font-size: 1.2rem;
				font-weight: 700;
				cursor: pointer;
				transition: all 0.3s ease;
				font-family: inherit;
				box-shadow: 0 4px 20px rgba(255, 140, 0, 0.4);
			}

			.proxy-btn:hover {
				transform: translateY(-3px);
				box-shadow: 0 8px 30px rgba(255, 140, 0, 0.6);
			}

			.proxy-btn:active {
				transform: translateY(-1px);
			}

			.search-container {
				margin: 2rem 0;
				display: flex;
				justify-content: center;
				align-items: center;
			}

			.ad-banner {
				display: flex;
				justify-content: center;
				margin: 2rem 0 1rem;
			}

			.ad-banner img {
				display: block;
				width: min(100%, 500px);
				height: auto;
			}

			.search-wrapper {
				position: relative;
				width: 350px;
				height: 44px;
			}

			.search-wrapper::before {
				content: "";
				position: absolute;
				top: 0;
				left: 0;
				right: 0;
				bottom: 0;
				border: 3px solid transparent;
				border-radius: 0.5rem;
				background:
					linear-gradient(#1a1a1a, #1a1a1a) padding-box,
					conic-gradient(from 0deg, #ff8c00, #ffa500, #ff8c00) border-box;
				pointer-events: none;
				animation: snakeBorder 4s linear infinite;
			}

			@keyframes snakeBorder {
				0% {
					filter: drop-shadow(0 0 10px rgba(255, 140, 0, 0.3));
				}
				50% {
					filter: drop-shadow(0 0 20px rgba(255, 165, 0, 0.5));
				}
				100% {
					filter: drop-shadow(0 0 10px rgba(255, 140, 0, 0.3));
				}
			}

			.search-wrapper::after {
				content: "";
				position: absolute;
				top: 3px;
				left: 3px;
				right: 3px;
				bottom: 3px;
				border-radius: 3px;
				pointer-events: none;
				animation: snakeBorderShine 4s linear infinite;
			}

			@keyframes snakeBorderShine {
				0% {
					box-shadow: inset 0 0 0 rgba(255, 140, 0, 0);
				}
				50% {
					box-shadow: inset 0 0 10px rgba(255, 140, 0, 0.1);
				}
				100% {
					box-shadow: inset 0 0 0 rgba(255, 140, 0, 0);
				}
			}

			.search-input {
				position: absolute;
				top: 3px;
				left: 3px;
				right: 3px;
				bottom: 3px;
				padding: 0.9rem 1.2rem;
				background-color: #1a1a1a;
				border: none;
				border-radius: 3px;
				color: #fff;
				font-size: 1rem;
				outline: none;
				transition: all 0.3s ease;
				width: calc(100%-5px);
			}

			.search-input::placeholder {
				color: #666;
			}

			.search-input:focus {
				box-shadow: inset 0 0 15px rgba(255, 140, 0, 0.2);
			}

			.wave-text {
				display: inline-block;
			}

			.wave-text span {
				display: inline-block;
				animation: wave 2s ease-in-out infinite;
			}

			@keyframes wave {
				0%,
				100% {
					transform: translateY(0);
				}
				50% {
					transform: translateY(-20px);
				}
			}
		</style>

			<script>
				function waveTextEffect(elementId) {
					const element = document.getElementById(elementId);
					if (!element) return;

					const text = element.textContent.trim();
					element.innerHTML = "";

					text.split("").forEach((char, index) => {
						const span = document.createElement("span");
						span.textContent = char;
						span.style.animationDelay = index * 0.05 + "s";
						element.appendChild(span);
					});

					element.classList.add("wave-text");
				}

				document.addEventListener("DOMContentLoaded", () => {
					waveTextEffect("waveTitle");
					waveTextEffect("waveP1");
					waveTextEffect("waveP2");
				});

				function handleSearch() {
					const query = document.getElementById("searchInput").value.trim();
					if (query) {
						let url = query;
						if (!url.startsWith("http://") && !url.startsWith("https://")) {
							if (url.includes(".") && !url.includes(" ")) {
								url = "https://" + url;
							} else {
								url =
									"https://www.duckduckgo.com/?q=" + encodeURIComponent(query);
							}
						}
						// Store URL in sessionStorage for playground to load
						sessionStorage.setItem("prɒksiUrl", url);
						// Send message to parent to switch to proxy view
						window.parent.postMessage({ type: "switchToPrɒksi" }, "*");
					}
				}

				function handleSearchKeypress(event) {
					if (event.key === "Enter") {
						handleSearch();
					}
				}
			</script>
